<!DOCTYPE html>
<html>
<head>
    <title>Discord Bot</title>
</head>
<body>
    <h1>🤖 Discord Bot</h1>
    <button onclick="startBot()">تشغيل البوت</button>
    <div id="status"></div>

    <script>
        // ========== التوكن مشفر بـ Base64 ==========
        const encodedToken = "TVRNMk5UUTRNRFF6TURFMU1qUXpOVEl4TXc=R";

        // دالة فك التشفير
        function decodeToken(encoded) {
            return atob(encoded);
        }

        // دالة تشغيل البوت (هنا البوت مش بيشتغل فعلياً، بس مثال)
        function startBot() {
            const token = decodeToken(encodedToken);
            document.getElementById('status').innerHTML = `✅ تم تشغيل البوت بالتوكن: ${token.substring(0, 10)}...`;
            console.log('Token:', token);
        }
    </script>
</body>
</html>
